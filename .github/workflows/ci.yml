name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transferflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Wait for services (TCP check)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import socket, time
          hosts = [("postgres", 5432), ("redis", 6379)]
          deadline = time.time() + 60
          for host, port in hosts:
              while True:
                  try:
                      with socket.create_connection((host, port), timeout=2):
                          print(f"{host}:{port} reachable")
                          break
                  except Exception:
                      if time.time() > deadline:
                          raise SystemExit(f"Timeout waiting for {host}:{port}")
                      time.sleep(1)
          PY

      - name: Run tests (use service hostnames)
        continue-on-error: true
        env:
          # use service container hostnames provided by GitHub Actions
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/transferflow
          REDIS_HOST: redis
          REDIS_PORT: 6379
        run: |
          pytest -q

      - name: Build docker image
        run: |
          docker build -t transferflow-api:ci .
