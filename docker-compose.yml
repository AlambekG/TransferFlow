services:
  postgres:
    # IMPORTANT: pin this image to a verified digest (example: postgres:16@sha256:...)
    # to ensure reproducible deploys and to avoid mutable tags.
    image: postgres:16
    container_name: transferflow-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    container_name: transferflow-api
    ports:
      - "8000:8000"
    environment:
      # Use environment-driven settings (see .env.example)
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_TTL: ${REDIS_TTL}
      RETRY_RETRIES: ${RETRY_RETRIES}
      RETRY_DELAY: ${RETRY_DELAY}
      MOCK_DELAY: ${MOCK_DELAY}
    depends_on:
      - postgres
    volumes:
      - .:/app
  redis:
    # IMPORTANT: pin this image to a verified digest (example: redis:7@sha256:...)
    # to ensure reproducible deploys and to avoid mutable tags.
    image: redis:7
    container_name: transferflow-redis
    ports:
      - "6379:6379"
  # kafka:
  #   image: bitnami/kafka:latest
  #   ports:
  #     - "9092:9092"
  #   environment:
  #     KAFKA_CFG_NODE_ID: 1
  #     KAFKA_CFG_PROCESS_ROLES: broker,controller
  #     KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
  #     KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  #     KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
  #     KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
  #     ALLOW_PLAINTEXT_LISTENER: yes
volumes:
  postgres_data: