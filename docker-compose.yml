services:
  postgres:
    # IMPORTANT: pin this image to a verified digest (example: postgres:16@sha256:...)
    # to ensure reproducible deploys and to avoid mutable tags.
    image: postgres:16
    container_name: transferflow-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transferflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    container_name: transferflow-api
    ports:
      - "8000:8000"
    environment:
      # Use the async driver URL expected by SQLAlchemy async engine
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/transferflow
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_TTL: "300"
      RETRY_RETRIES: "3"
      RETRY_DELAY: "0.5"
      MOCK_DELAY: "0.3"
    depends_on:
      - postgres
    volumes:
      - .:/app
  redis:
    # IMPORTANT: pin this image to a verified digest (example: redis:7@sha256:...)
    # to ensure reproducible deploys and to avoid mutable tags.
    image: redis:7
    container_name: transferflow-redis
    ports:
      - "6379:6379"
